<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendor Onboarding</title>
  <link rel="stylesheet" href="/common/shell.css" />
  <style>
    .req { margin: 0; padding-left: 20px; }
    .req li { margin-bottom: 10px; }
    .req .why { color: var(--muted); font-size: 12.5px; }
    details.grp { border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; background: var(--panel); }
    details.grp > summary { padding: 9px 12px; cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; list-style: none; }
    details.grp > summary::-webkit-details-marker { display: none; }
    details.grp > summary::before { content: "▸"; color: var(--faint); width: 10px; }
    details.grp[open] > summary::before { content: "▾"; }
    details.grp > summary .cnt { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); }
    details.grp .body { padding: 0 12px 6px 12px; border-top: 1px solid var(--border); }
    .notes { margin: 0; padding-left: 18px; font-size: 13px; }
    .notes li { margin-bottom: 6px; }
    .resub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .resub div { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
    .resub b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
    .files .frow { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12.5px; }
    .files .frow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .files .frow select { width: 210px; flex: none; padding: 4px 6px; }
    .err { color: var(--bad); font-size: 12.5px; margin-top: 6px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
    .stats b { color: var(--text); }
    #sub-json { min-height: 340px; }
    .rv { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--panel); }
    .rv .row { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .rv input, .rv textarea { width: 100%; box-sizing: border-box; }
    .rv textarea { min-height: 64px; }
    .rv .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .rv .blocked { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .rv .blocked div { margin-bottom: 3px; }
    .btn.good { background: var(--good); color: #fff; border-color: var(--good); }
    .btn.bad { background: var(--bad); color: #fff; border-color: var(--bad); }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .hist { margin: 0; padding-left: 18px; font-size: 12.5px; }
    .hist li { margin-bottom: 5px; }
    .fu-tone { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .fu-tone.bad { background: var(--bad); } .fu-tone.warn { background: #f59e0b; } .fu-tone.info { background: var(--info); }
    .ok-msg { color: var(--good); font-size: 12.5px; margin-top: 6px; }
  </style>
</head>
<body>
  <script src="/common/shell.js"></script>
  <script>
    const esc = (s) => Shell.esc(s);
    const DOC_LABELS = {
      tax_document: "Tax registration (W-9 / VAT / GST)",
      bank_proof: "Bank letter / cancelled cheque",
      incorporation: "Certificate of incorporation",
      insurance: "Certificate of insurance",
    };
    const TONE = { APPROVED: "good", PENDING: "warn", MANUAL_REVIEW: "info", REJECTED: "bad" };
    const LABEL = { APPROVED: "Approved", PENDING: "Pending vendor", MANUAL_REVIEW: "Manual review", REJECTED: "Rejected" };
    const fileUrl = (p) => "/api/file/" + String(p || "").split("/").map(encodeURIComponent).join("/");

    function guessType(name) {
      const n = name.toLowerCase();
      if (/bank|cheque|check|iban|account/.test(n)) return "bank_proof";
      if (/insur|coi|liabil/.test(n)) return "insurance";
      if (/incorp|formation|handels|register|companies|cin/.test(n)) return "incorporation";
      return "tax_document";
    }

    // ------------------------------------------------------------ custom input
    function renderCustomInput(el, ctx) {
      const opts = ctx.meta.scenarios.map((s) => `<option value="${esc(s.id)}">${esc(s.title)}</option>`).join("");
      el.innerHTML = `
        <label class="f">Start from a prepared submission</label>
        <select id="tpl">${opts}</select>
        <label class="f">Submission (JSON - edit any field)</label>
        <textarea id="sub-json" spellcheck="false"></textarea>
        <div class="hint">Try: change one digit of <code>routing_number</code>, set <code>account_holder</code> to a person's name, or change <code>country</code>. Use a new <code>submission_id</code> for a new case, or set <code>resubmission_of</code> to an earlier one.</div>
        <label class="f">Replace / add documents (optional)</label>
        <div class="drop" id="drop">Drop PDFs or images here, or click to choose</div>
        <input type="file" id="file" multiple accept=".pdf,.png,.jpg,.jpeg" class="hidden" />
        <div class="files" id="files"></div>
        <div class="hint">An uploaded file replaces the document of the same type in the JSON.</div>
        <div id="err" class="err"></div>
        <div style="margin-top:12px; display:flex; gap:8px">
          <button class="btn primary" id="go">Run onboarding checks</button>
          <button class="btn" id="fmt">Format JSON</button>
        </div>`;
      const ta = el.querySelector("#sub-json"), tpl = el.querySelector("#tpl"), err = el.querySelector("#err");
      let files = [];
      const load = async () => {
        const data = await (await fetch(`/api/scenarios/${tpl.value}/input`)).json();
        ta.value = JSON.stringify(data, null, 2);
        err.textContent = "";
      };
      tpl.onchange = load;
      load();
      const drawFiles = () => {
        el.querySelector("#files").innerHTML = files.map((f, i) => `
          <div class="frow"><span title="${esc(f.file.name)}">${esc(f.file.name)}</span>
            <select data-i="${i}">${Object.entries(DOC_LABELS).map(([k, v]) => `<option value="${k}" ${k === f.type ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
            <button class="btn sm" data-x="${i}">✕</button></div>`).join("");
        el.querySelectorAll("#files select").forEach((s) => (s.onchange = () => (files[+s.dataset.i].type = s.value)));
        el.querySelectorAll("#files button[data-x]").forEach((b) => (b.onclick = () => { files.splice(+b.dataset.x, 1); drawFiles(); }));
      };
      const add = (list) => { for (const f of list) files.push({ file: f, type: guessType(f.name) }); drawFiles(); };
      const drop = el.querySelector("#drop"), inp = el.querySelector("#file");
      drop.onclick = () => inp.click();
      inp.onchange = () => { add(inp.files); inp.value = ""; };
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
      el.querySelector("#fmt").onclick = () => {
        try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); err.textContent = ""; } catch (e) { err.textContent = "Invalid JSON: " + e.message; }
      };
      el.querySelector("#go").onclick = () => {
        let parsed;
        try { parsed = JSON.parse(ta.value); } catch (e) { err.textContent = "Invalid JSON: " + e.message; return; }
        err.textContent = "";
        const fd = new FormData();
        fd.append("submission", JSON.stringify(parsed));
        fd.append("doc_types", JSON.stringify(files.map((f) => f.type)));
        files.forEach((f) => fd.append("files", f.file));
        ctx.startRun(fetch("/api/submit", { method: "POST", body: fd }));
      };
    }

    // ------------------------------------------------------------ result
    function renderResult(el, run) {
      const r = run.result || {};
      const d = run.decision;
      const v = r.vendor || {};
      const st = r.stats || {};
      let h = `
        <div class="result-banner ${TONE[d] || "info"}">
          <div style="min-width:0">
            <div class="rb-title">${esc(LABEL[d] || d)}${r.vendor_id ? ` · supplier ${esc(r.vendor_id)}` : ""}</div>
            <div class="rb-sub"><b>${esc(r.headline || run.summary)}</b></div>
            <div class="rb-sub">${esc(r.reason || "")}</div>
            <div class="stats"><span><b>${st.passed ?? 0}</b> passed</span><span><b>${st.failed ?? 0}</b> failed</span><span><b>${st.warnings ?? 0}</b> warnings</span>
              <span>risk score <b>${r.risk ? r.risk.score : 0}</b></span><span>${esc(v.legal_name || "")} · ${esc(v.country || "")}</span></div>
          </div>
        </div>`;

      if (r.review) {
        const rv = r.review;
        h += `<div class="section"><h4>Reviewer decision</h4>
          <div class="small"><b>${esc(rv.reviewer)}</b> changed <b>${esc(LABEL[rv.previous_decision] || rv.previous_decision)}</b> →
            <b>${esc(LABEL[rv.new_decision] || rv.new_decision)}</b> at ${esc(new Date(rv.at).toLocaleString())}</div>
          <div class="small" style="margin-top:4px">Reason: ${esc(rv.note)}</div>
          ${rv.vendor_message ? `<div class="small" style="margin-top:4px">Asked the vendor: “${esc(rv.vendor_message)}”</div>` : ""}
          ${(rv.overrode || []).length ? `<div class="small muted" style="margin-top:4px">Findings the reviewer ruled on: ${esc(rv.overrode.join("; "))}</div>` : ""}
          ${rv.email ? `<div class="msg-box" style="margin-top:8px"><div class="mh"><div>To: <b>${esc(rv.email.to)}</b></div><div>Subject: <b>${esc(rv.email.subject)}</b></div></div>
            <div class="mb">${esc(rv.email.body)}</div></div>` : ""}</div>`;
      }

      // reviewer actions + audit trail are loaded after render (they depend on server-side rules)
      h += `<div id="review-slot"></div>`;

      if (d === "PENDING") {
        const rem = r.reminders || [];
        h += `<div class="section"><h4>Follow-up with the vendor</h4>
          <div class="small">Reply due <b>${esc(r.reply_by || "—")}</b> · reminder after 3 days of silence, escalation to the requester after 7 ·
            ${rem.length} reminder(s) sent${rem.length ? ` (last ${esc(new Date(rem[rem.length - 1].at).toLocaleString())})` : ""}</div>
          <div style="margin-top:8px"><button class="btn sm" id="remind">Send reminder now</button></div>
          <div id="remind-msg"></div></div>`;
      }

      if (r.resubmission) {
        const rs = r.resubmission;
        const li = (a) => a.length ? a.map((x) => `<div>• ${esc(x)}</div>`).join("") : `<div class="muted">none</div>`;
        h += `<div class="section"><h4>Resubmission - compared with <a href="#/run/${esc(rs.previous_run)}">run ${esc(rs.previous_run)}</a> (${esc(LABEL[rs.previous_decision] || rs.previous_decision)})</h4>
          <div class="resub"><div><b style="color:var(--good)">Resolved</b>${li(rs.resolved)}</div><div><b style="color:var(--warn)">Still open</b>${li(rs.still_open)}</div><div><b>New</b>${li(rs.new)}</div></div></div>`;
      }

      if ((r.vendor_requests || []).length) {
        h += `<div class="section"><h4>What we need from the vendor</h4><ol class="req">${r.vendor_requests.map((q) => `
          <li><b>${esc(q.title)}</b><div>${esc(q.request)}</div><div class="why">Why: ${esc(q.why)}</div></li>`).join("")}</ol></div>`;
      }

      if (d !== "APPROVED" || (r.reviewer_notes || []).some((n) => n.startsWith("[NOTE]"))) {
        h += `<div class="section"><h4>Internal reviewer notes <span class="muted small">(never sent to the vendor)</span></h4>
          <ul class="notes">${(r.reviewer_notes || []).map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>`;
      }

      if (r.email) {
        h += `<div class="section"><h4>Email to vendor <span class="muted small">(${esc(r.email.engine || "")})</span></h4>
          <div class="msg-box"><div class="mh"><div>To: <b>${esc(r.email.to)}</b></div><div>Subject: <b>${esc(r.email.subject)}</b></div></div>
          <div class="mb">${esc(r.email.body)}</div></div></div>`;
      }
      if (r.internal_email) {
        h += `<div class="section"><h4>Internal escalation</h4>
          <div class="msg-box"><div class="mh"><div>To: <b>${esc(r.internal_email.to)}</b></div><div>Subject: <b>${esc(r.internal_email.subject)}</b></div></div>
          <div class="mb">${esc(r.internal_email.body)}</div></div></div>`;
      }

      // checks grouped by stage
      const groups = [];
      (r.checks || []).forEach((c) => {
        let g = groups.find((x) => x.key === c.stage);
        if (!g) groups.push((g = { key: c.stage, title: c.stage_title, items: [] }));
        g.items.push(c);
      });
      h += `<div class="section"><h4>All checks, by stage</h4>${groups.map((g) => {
        const f = g.items.filter((c) => c.status === "fail").length, w = g.items.filter((c) => c.status === "warn").length;
        const p = g.items.filter((c) => c.status === "pass").length;
        const badge = f ? `<span class="pill bad">${f} failed</span>` : w ? `<span class="pill warn">${w} warning${w > 1 ? "s" : ""}</span>` : `<span class="pill good">all passed</span>`;
        return `<details class="grp" ${f || w ? "open" : ""}><summary>${esc(g.title)} ${badge}<span class="cnt">${p}/${g.items.length} passed</span></summary>
          <div class="body">${Shell.checks(g.items.map((c) => ({ status: c.status === "info" ? "na" : c.status, name: c.name, detail: c.detail })))}</div></details>`;
      }).join("")}</div>`;

      if ((r.documents || []).length) {
        h += `<div class="section"><h4>Documents read</h4><div style="overflow-x:auto"><table class="t"><thead><tr><th>File</th><th>Uploaded as</th><th>Content looks like</th><th>How read</th></tr></thead><tbody>
          ${r.documents.map((x) => `<tr><td>${x.path ? `<a href="${fileUrl(x.path)}" target="_blank">${esc(x.file.split("/").pop())}</a>` : esc(x.file)}</td>
            <td class="small">${esc(DOC_LABELS[x.declared] || x.declared)}</td>
            <td class="small">${x.detected === x.declared ? "✓ same" : `<b style="color:var(--bad)">${esc(DOC_LABELS[x.detected] || "unrecognised")}</b>`}</td>
            <td class="small muted">${esc(x.method)}</td></tr>`).join("")}</tbody></table></div></div>`;
      }

      if ((r.outputs || []).length) {
        h += `<div class="section"><h4>Outputs written</h4>${r.outputs.map((o) => `<div class="small" style="margin-bottom:4px">${esc(o.label)} - <a href="${fileUrl(o.path)}" target="_blank"><code>${esc(o.path)}</code></a></div>`).join("")}</div>`;
      }
      el.innerHTML = h;

      const remind = el.querySelector("#remind");
      if (remind) remind.onclick = async () => {
        remind.disabled = true;
        const msg = el.querySelector("#remind-msg");
        const res = await fetch(`/api/runs/${run.id}/remind`, { method: "POST" });
        const body = await res.json();
        if (res.ok) { msg.className = "ok-msg"; msg.textContent = `Reminder ${body.reminder} written to ${body.email.path}`; setTimeout(() => reopen(run.id), 900); }
        else { msg.className = "err"; msg.textContent = body.detail; remind.disabled = false; }
      };
      loadReview(el.querySelector("#review-slot"), run);
    }

    // Show the run again with fresh data (decision pill in the header included).
    function reopen(id) {
      const target = `#/run/${id}`;
      if (location.hash === target) location.reload(); else location.hash = target;
    }

    const EVENT_LABEL = { automated_decision: "Automated decision", reviewer_decision: "Reviewer decision", reminder_sent: "Reminder sent" };

    async function loadReview(slot, run) {
      if (!slot) return;
      let o;
      try { o = await (await fetch(`/api/runs/${run.id}/review`)).json(); } catch { return; }
      let h = "";
      if (o.reviewable) {
        const a = o.actions || {};
        const blocked = Object.entries(a).filter(([, why]) => why);
        const nice = { approve: "Approve", reject: "Reject", request_info: "Request info" };
        h += `<div class="section"><h4>Reviewer decision needed</h4><div class="rv">
          <div class="small muted" style="margin-bottom:8px">${run.decision === "REJECTED"
            ? "Automatic fraud / compliance hold. A reviewer confirms the rejection or, after independent verification (e.g. a call-back on the number already on file), overturns it."
            : "The rules stopped short of a final answer."} The decision, reason and vendor email are recorded against the reviewer's name in the audit log.</div>
          <div class="row">
            <div><label class="f">Reviewer</label><input id="rv-name" placeholder="Your name" /></div>
            <div><label class="f">Reason for the decision (internal, audit log)</label><textarea id="rv-note" placeholder="e.g. Called V-1007 on the number on file; they confirmed the account change is genuine (ticket #4471)."></textarea></div>
            <div><label class="f">Message to the vendor (only for “Request info”)</label><textarea id="rv-msg" placeholder="e.g. Please send the register extract listing your managing directors and shareholders."></textarea></div>
          </div>
          <div class="acts">
            <button class="btn good" data-a="approve" ${a.approve ? "disabled" : ""}>Approve</button>
            <button class="btn" data-a="request_info" ${a.request_info ? "disabled" : ""}>Request info → pending</button>
            <button class="btn bad" data-a="reject" ${a.reject ? "disabled" : ""}>Reject</button>
          </div>
          ${blocked.length ? `<div class="blocked">${blocked.map(([k, why]) => `<div><b>${esc(nice[k])}:</b> ${esc(why)}</div>`).join("")}</div>` : ""}
          <div id="rv-err"></div></div></div>`;
      }
      if ((o.audit || []).length) {
        h += `<div class="section"><h4>Audit trail for this case <span class="muted small">(data/audit_log.jsonl, append-only)</span></h4><ol class="hist">${o.audit.map((e) => `
          <li><b>${esc(EVENT_LABEL[e.event] || e.event)}</b> · ${esc(new Date(e.at).toLocaleString())} · by ${esc(e.by)} ·
            ${esc(LABEL[e.decision] || e.decision || "")}${e.run_id ? ` · <a href="#/run/${esc(e.run_id)}">run ${esc(e.run_id)}</a>` : ""}
            ${e.note ? `<div class="muted">${esc(e.note)}</div>` : ""}</li>`).join("")}</ol></div>`;
      }
      slot.innerHTML = h;
      slot.querySelectorAll("button[data-a]").forEach((b) => (b.onclick = async () => {
        const err = slot.querySelector("#rv-err");
        const payload = { action: b.dataset.a, reviewer: slot.querySelector("#rv-name").value,
                          note: slot.querySelector("#rv-note").value, vendor_message: slot.querySelector("#rv-msg").value };
        if (b.dataset.a !== "request_info" && !confirm(`${b.textContent.trim()} this vendor? This is recorded against your name.`)) return;
        slot.querySelectorAll("button[data-a]").forEach((x) => (x.disabled = true));
        const res = await fetch(`/api/runs/${run.id}/review`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        const body = await res.json();
        if (res.ok) { reopen(run.id); return; }
        err.className = "err"; err.textContent = body.detail;
        slot.querySelectorAll("button[data-a]").forEach((x) => (x.disabled = !!(o.actions || {})[x.dataset.a]));
      }));
    }

    // ------------------------------------------------------------ dashboard: follow-up queue
    async function dashboardExtra(el) {
      let items = [];
      try { items = await (await fetch("/api/followups")).json(); } catch { return; }
      el.innerHTML = `<div class="card" style="margin-bottom:16px">
        <div class="card-h"><h2>Open cases - who has to act next</h2><span class="muted small" style="margin-left:auto">${items.length} open · latest run of each case</span></div>
        <div style="overflow-x:auto"><table class="t"><thead><tr><th>Vendor</th><th>Waiting on</th><th>Status</th><th>Open items</th><th class="num">Age</th><th>Reply by</th><th class="num">Reminders</th></tr></thead><tbody>
        ${items.map((f) => `<tr class="click" data-id="${esc(f.run_id)}">
            <td><b>${esc(f.vendor)}</b><div class="small muted">${esc(f.case_id)}</div></td>
            <td>${f.waiting_on === "vendor" ? "Vendor" : "Reviewer"}</td>
            <td class="small"><span class="fu-tone ${esc(f.tone)}"></span>${esc(f.status)}</td>
            <td class="small"><div class="ellipsis" title="${esc(f.open_items.join("; "))}">${esc(f.open_items.join("; "))}</div></td>
            <td class="num small">${f.age_days} d</td><td class="small">${esc(f.reply_by || "—")}</td><td class="num small">${f.reminders_sent}</td></tr>`).join("")
          || `<tr><td colspan="7" class="empty">Nothing open - every case is approved or rejected.</td></tr>`}
        </tbody></table></div></div>`;
      el.querySelectorAll("tr[data-id]").forEach((tr) => (tr.onclick = () => (location.hash = "#/run/" + tr.dataset.id)));
    }

    // ------------------------------------------------------------ dashboard KPIs
    function kpis(runs) {
      const ok = runs.filter((r) => r.status === "completed");
      const approved = ok.filter((r) => r.decision === "APPROVED" && !(r.result && r.result.review)).length;
      const reviewed = ok.filter((r) => r.result && r.result.review).length;
      const counts = {};
      ok.forEach((r) => ((r.result && r.result.issues) || []).forEach((i) => {
        if (i.severity !== "warn") counts[i.title] = (counts[i.title] || 0) + 1;
      }));
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      const held = ok.filter((r) => r.decision === "REJECTED" || r.decision === "MANUAL_REVIEW").length;
      const emails = ok.filter((r) => r.result && r.result.email).length;
      return [
        { label: "Auto-approval rate", val: ok.length ? Math.round((100 * approved) / ok.length) + "%" : "—", sub: `${approved} of ${ok.length} approved without a human` },
        { label: "Most common blocker", val: top ? `${top[1]}×` : "—", sub: top ? top[0] : "no blockers yet" },
        { label: "Held for fraud / compliance", val: held, sub: "rejected or manual review" },
        { label: "Closed by a reviewer", val: reviewed, sub: "human decisions, all in the audit log" },
        { label: "Vendor emails written", val: emails, sub: "in ps2_vendor/outbox/" },
      ];
    }

    Shell.init({
      mark: "VO",
      decisionTone: TONE,
      decisionLabel: LABEL,
      customTitle: "Custom submission",
      renderCustomInput,
      renderResult,
      kpis,
      dashboardExtra,
    });
  </script>
</body>
</html>
